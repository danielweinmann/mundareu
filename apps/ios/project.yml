name: Mundareu
options:
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: '17.0'
targets:
  Mundareu:
    type: application
    platform: iOS
    configFiles:
      Debug: Mundareu.xcconfig
      Release: Mundareu.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielweinmann.mundareu
        PRODUCT_NAME: Mundareu
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: 'NO'
        TARGETED_DEVICE_FAMILY: '2'
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        SUPPORTS_MACCATALYST: 'NO'
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
    preBuildScripts:
      - script: ./build_rust_binary.sh
        name: Build the Rust binary
        inputFiles:
          - $(SRCROOT)/build_rust_binary.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        basedOnDependencyAnalysis: false
    scheme: {}
