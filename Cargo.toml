[workspace]
resolver = "3"
members = ["crates/world", "crates/game", "apps/mundareu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mundareu-world = { path = "crates/world" }
mundareu-game = { path = "crates/game" }
bevy = "0.19.1"
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
directories = "6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
