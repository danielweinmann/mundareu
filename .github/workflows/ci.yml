name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the Linux libraries Bevy links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tsc

  ios:
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: target/ios
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: cargo build --target aarch64-apple-ios -p mundareu
      - run: xcodegen generate
        working-directory: apps/ios
      - run: xcodebuild -project apps/ios/Mundareu.xcodeproj -scheme Mundareu -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/ios/build CODE_SIGNING_ALLOWED=NO build
